[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promas"
version = "1.0.0"
description = "Universal product image scraper and Model Context Protocol (MCP) server for AI agents"
readme = "README.md"
authors = [
    { name = "szqiel", email = "author@promas.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "product-scraper",
    "image-scraper",
    "mcp",
    "fastmcp",
    "model-context-protocol",
    "ai-agent",
    "playwright",
    "stealth",
    "schema-org",
    "json-ld",
    "phash",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.49.0",
    "playwright-stealth>=2.0.0",
    "mcp>=1.2.0",
    "fastmcp>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "diskcache>=5.6.0",
    "httpx>=0.27.0",
    "ImageHash>=4.3.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
promas = "promas.cli.main:main"
promas-mcp = "promas.server.mcp_server:run_server"

[project.urls]
Homepage = "https://github.com/szqiel/promas"
Repository = "https://github.com/szqiel/promas.git"
"Bug Tracker" = "https://github.com/szqiel/promas/issues"
Documentation = "https://github.com/szqiel/promas#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["promas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as golden integration tests (hit real sites)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
